name: CI

on:
  push:
  pull_request:

jobs:
  python:
    name: Python lint and fast tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Set up Python projects
        run: python scripts/tasks.py setup
      - name: Lint
        run: python scripts/tasks.py lint
      - name: Fast tests
        run: python scripts/tasks.py test-fast

  sdk:
    name: SDK lint, typecheck, tests and build
    runs-on: windows-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: sdk/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  portal:
    name: Portal lint, typecheck, tests and build
    runs-on: windows-latest
    needs: sdk
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Install and build SDK
        working-directory: sdk
        run: npm ci && npm run build
      - name: Install portal
        working-directory: portal
        run: npm ci
      - name: Lint
        working-directory: portal
        run: npm run lint
      - name: Typecheck
        working-directory: portal
        run: npm run typecheck
      - name: Tests
        working-directory: portal
        run: npm test
      - name: Build
        working-directory: portal
        run: npm run build
