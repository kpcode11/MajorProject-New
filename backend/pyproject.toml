[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "botguard-backend"
version = "0.1.0"
description = "HTTP scoring backend for the passive bot-detection mock portal."
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "sqlalchemy",
    "PyJWT",
    "redis",
    "fakeredis",
    "PyYAML",
    "numpy",
    "onnxruntime",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "hypothesis",
    "httpx",
    "ruff",
    "mypy",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
files = ["app"]
strict = true
warn_unused_configs = true
